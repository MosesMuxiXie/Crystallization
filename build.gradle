plugins {
	id 'base'
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

def externalBuildRoot = providers.gradleProperty('build_root').orNull
if (externalBuildRoot != null) {
	layout.buildDirectory = new File(externalBuildRoot, 'root')
}

ext.minecraftTargets = [
		mc1_16_5 : [minecraft: '1.16.5', api: '0.42.0+1.16',    modmenu: '1.16.23',          java: 8,  minecraftRange: '>=1.16 <=1.16.5',     tier: 'legacy_1_16', unobfuscated: false],
		mc1_17_1 : [minecraft: '1.17.1', api: '0.46.1+1.17',    modmenu: '2.0.17',           java: 16, minecraftRange: '>=1.17 <=1.17.1',     tier: 'legacy_1_17', unobfuscated: false],
		mc1_18_2 : [minecraft: '1.18.2', api: '0.77.0+1.18.2',  modmenu: '3.2.5',            java: 17, minecraftRange: '>=1.18 <=1.18.2',     tier: 'legacy_1_18', unobfuscated: false],
		mc1_19_2 : [minecraft: '1.19.2', api: '0.77.0+1.19.2',  modmenu: '4.2.0-beta.2',     java: 17, minecraftRange: '>=1.19 <=1.19.2',     tier: 'legacy_1_19', unobfuscated: false],
		mc1_19_4 : [minecraft: '1.19.4', api: '0.87.2+1.19.4',  modmenu: '6.3.1',            java: 17, minecraftRange: '>=1.19.3 <=1.19.4',   tier: 'legacy_1_19_4', unobfuscated: false],
		mc1_20_1 : [minecraft: '1.20.1', api: '0.92.11+1.20.1', modmenu: '7.2.2',            java: 17, minecraftRange: '>=1.20 <=1.20.1',     tier: 'legacy_1_20', unobfuscated: false],
		mc1_20_4 : [minecraft: '1.20.4', api: '0.97.3+1.20.4',  modmenu: '9.2.0',            java: 17, minecraftRange: '>=1.20.2 <=1.20.4',   tier: 'legacy_1_20', unobfuscated: false],
		mc1_20_6 : [minecraft: '1.20.6', api: '0.100.8+1.20.6', modmenu: '10.0.0',           java: 21, minecraftRange: '>=1.20.5 <=1.20.6',   tier: 'payload_1_20', unobfuscated: false],
		mc1_21_1 : [minecraft: '1.21.1', api: '0.116.15+1.21.1',modmenu: '11.0.3',           java: 21, minecraftRange: '>=1.21 <=1.21.1',     tier: 'payload_1_21', unobfuscated: false],
		mc1_21_4 : [minecraft: '1.21.4', api: '0.119.4+1.21.4', modmenu: '13.0.3',           java: 21, minecraftRange: '>=1.21.2 <=1.21.4',   tier: 'payload_1_21_4', unobfuscated: false],
		mc1_21_5 : [minecraft: '1.21.5', api: '0.128.2+1.21.5', modmenu: '14.0.0',           java: 21, minecraftRange: '1.21.5',              tier: 'payload_1_21_5', unobfuscated: false],
		mc1_21_8 : [minecraft: '1.21.8', api: '0.136.1+1.21.8', modmenu: '15.0.0',           java: 21, minecraftRange: '>=1.21.6 <=1.21.8',   tier: 'payload_1_21_8', unobfuscated: false],
		mc1_21_11: [minecraft: '1.21.11',api: '0.141.6+1.21.11',modmenu: '17.0.0',           java: 21, minecraftRange: '>=1.21.9 <=1.21.11',  tier: 'payload_1_21_11', unobfuscated: false],
		mc26_1_2 : [minecraft: '26.1.2', api: '0.155.2+26.1.2', modmenu: '20.0.0-beta.2',   java: 25, minecraftRange: '>=26.1 <=26.1.2',     tier: 'unobfuscated_26_1', unobfuscated: true],
		mc26_2   : [minecraft: '26.2',   api: '0.156.0+26.2',   modmenu: '21.0.0-alpha.1',  java: 25, minecraftRange: '26.2',                tier: 'unobfuscated_26_2', unobfuscated: true]
]

subprojects {
	def target = rootProject.ext.minecraftTargets[project.name]
	if (target == null) {
		throw new GradleException("Missing Minecraft target configuration for ${project.path}")
	}

	apply plugin: target.unobfuscated
			? 'net.fabricmc.fabric-loom'
			: 'net.fabricmc.fabric-loom-remap'
	apply plugin: 'maven-publish'
	if (externalBuildRoot != null) {
		layout.buildDirectory = new File(externalBuildRoot, project.name)
	}
	def splitEnvironment = !(target.tier in ['legacy_1_16', 'legacy_1_17'])

	version = rootProject.mod_version
	group = rootProject.maven_group

	base {
		archivesName = "crystallization-mc${target.minecraft}"
	}

	repositories {
		maven {
			name = 'TerraformersMC'
			url = 'https://maven.terraformersmc.com/releases/'
		}
		maven {
			name = 'Nucleoid'
			url = 'https://maven.nucleoid.xyz/'
		}
	}

	loom {
		if (splitEnvironment) {
			splitEnvironmentSourceSets()
		}

		mods {
			crystallization {
				sourceSet sourceSets.main
				if (splitEnvironment) {
					sourceSet sourceSets.client
				}
			}
		}
	}

	def commonMainJava = rootProject.file('src/common/main/java')
	def commonClientJava = rootProject.file('src/common/client/java')
	def sourceTier = [
			legacy_1_17: 'legacy_1_16',
			legacy_1_18: 'legacy_1_16',
			legacy_1_19_4: 'legacy_1_19',
			legacy_1_20: 'legacy_1_19',
			payload_1_21_4: 'payload_1_21',
			payload_1_21_5: 'payload_1_21',
			payload_1_21_8: 'payload_1_21'
	].get(target.tier, target.tier)
	def tierRoot = rootProject.file("src/compat/${sourceTier}")
	def tierMainJava = target.tier == 'payload_1_21_11'
			? rootProject.file('src/main/java')
			: target.tier == 'unobfuscated_26_1'
					? rootProject.file('src/compat/unobfuscated_26_2/main/java')
					: new File(tierRoot, 'main/java')
	def tierClientJava = target.tier == 'payload_1_21_11'
			? rootProject.file('src/client/java')
			: new File(tierRoot, 'client/java')
	def legacyScreenTier = [
			legacy_1_16: 'screen_1_16',
			legacy_1_17: 'screen_1_17',
			legacy_1_18: 'screen_1_17',
			legacy_1_19: 'screen_1_19',
			legacy_1_19_4: 'screen_1_19_4',
			legacy_1_20: 'screen_1_20',
			payload_1_20: 'screen_1_20',
			payload_1_21: 'screen_1_21',
			payload_1_21_4: 'screen_1_21',
			payload_1_21_5: 'screen_1_21',
			payload_1_21_8: 'screen_1_21',
			unobfuscated_26_1: 'screen_26_1',
			unobfuscated_26_2: 'screen_26_2'
	][target.tier]
	def extraTierClientJava = legacyScreenTier == null
			? null
			: rootProject.file("src/compat/${legacyScreenTier}/client/java")
	def clientJavaDirs = [commonClientJava, tierClientJava]
	if (extraTierClientJava != null) {
		clientJavaDirs.add(extraTierClientJava)
	}

	sourceSets.main {
		java.setSrcDirs([commonMainJava, tierMainJava])
		resources.setSrcDirs([rootProject.file('src/main/resources')])
	}
	if (splitEnvironment) {
		sourceSets.client {
			java.setSrcDirs(clientJavaDirs)
			resources.setSrcDirs([rootProject.file('src/client/resources')])
		}
	} else {
		sourceSets.main.java.srcDirs(clientJavaDirs)
		sourceSets.main.resources.srcDir(rootProject.file('src/client/resources'))
	}

	dependencies {
		minecraft "com.mojang:minecraft:${target.minecraft}"
		if (!target.unobfuscated) {
			mappings loom.officialMojangMappings()
			modImplementation "net.fabricmc:fabric-loader:${loader_version}"
			modImplementation "net.fabricmc.fabric-api:fabric-api:${target.api}"
			modCompileOnly("com.terraformersmc:modmenu:${target.modmenu}") {
				transitive = false
			}
			modLocalRuntime("com.terraformersmc:modmenu:${target.modmenu}") {
				transitive = false
			}
		} else {
			implementation "net.fabricmc:fabric-loader:${loader_version}"
			implementation "net.fabricmc.fabric-api:fabric-api:${target.api}"
			compileOnly("com.terraformersmc:modmenu:${target.modmenu}") {
				transitive = false
			}
			runtimeOnly("com.terraformersmc:modmenu:${target.modmenu}") {
				transitive = false
			}
		}
	}

	def resourceProperties = [
			version: project.version,
			minecraft_dependency: target.minecraftRange,
			java_dependency: ">=${target.java}",
			fabric_loader_dependency: target.unobfuscated ? '>=0.19.0' : '>=0.14.24',
			modmenu_dependency: ">=${target.modmenu}",
			mixin_compatibility: "JAVA_${target.java}"
	]

	processResources {
		inputs.properties(resourceProperties)

		filesMatching(['fabric.mod.json', 'crystallization.client.mixins.json']) {
			expand resourceProperties
		}
	}
	if (splitEnvironment) {
		tasks.named('processClientResources') {
			inputs.properties(resourceProperties)
			filesMatching('crystallization.client.mixins.json') {
				expand resourceProperties
			}
		}
	}

	tasks.withType(JavaCompile).configureEach {
		options.release = target.java
		options.encoding = 'UTF-8'
	}

	java {
		withSourcesJar()
		def targetVersion = JavaVersion.toVersion(target.java)
		sourceCompatibility = targetVersion
		targetCompatibility = targetVersion
	}

	jar {
		from(rootProject.file('LICENSE')) {
			rename { "${it}_crystallization" }
		}
	}

	publishing {
		publications {
			create('mavenJava', MavenPublication) {
				from components.java
			}
		}
	}
}

tasks.named('build') {
	dependsOn subprojects.collect { it.tasks.named('build') }
}

tasks.register('collectJars', Copy) {
	group = 'build'
	description = 'Builds every supported Minecraft target and collects distributable JARs.'
	dependsOn subprojects.collect { project ->
		def target = rootProject.ext.minecraftTargets[project.name]
		project.tasks.named(target.unobfuscated ? 'jar' : 'remapJar')
	}
	into layout.buildDirectory.dir('libs')
	from subprojects.collect { project ->
		def target = rootProject.ext.minecraftTargets[project.name]
		project.tasks.named(target.unobfuscated ? 'jar' : 'remapJar').flatMap { it.archiveFile }
	}
}

tasks.named('build') {
	finalizedBy tasks.named('collectJars')
}
