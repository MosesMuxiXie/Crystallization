name: build

on: [pull_request, push]

jobs:
  build:
    name: Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mc1_16_5
            minecraft: 1.16-1.16.5
          - target: mc1_17_1
            minecraft: 1.17-1.17.1
          - target: mc1_18_2
            minecraft: 1.18-1.18.2
          - target: mc1_19_2
            minecraft: 1.19-1.19.2
          - target: mc1_19_4
            minecraft: 1.19.3-1.19.4
          - target: mc1_20_1
            minecraft: 1.20-1.20.1
          - target: mc1_20_4
            minecraft: 1.20.2-1.20.4
          - target: mc1_20_6
            minecraft: 1.20.5-1.20.6
          - target: mc1_21_1
            minecraft: 1.21-1.21.1
          - target: mc1_21_4
            minecraft: 1.21.2-1.21.4
          - target: mc1_21_5
            minecraft: 1.21.5
          - target: mc1_21_8
            minecraft: 1.21.6-1.21.8
          - target: mc1_21_11
            minecraft: 1.21.9-1.21.11
          - target: mc26_1_2
            minecraft: 26.1-26.1.2
          - target: mc26_2
            minecraft: '26.2'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build ${{ matrix.minecraft }}
        run: ./gradlew --configure-on-demand :${{ matrix.target }}:build

      - name: Upload distributable JAR
        uses: actions/upload-artifact@v7
        with:
          name: crystallization-mc${{ matrix.minecraft }}
          path: |
            versions/${{ matrix.target }}/build/libs/crystallization-mc*.jar
            !versions/${{ matrix.target }}/build/libs/*-sources.jar
